name: Daily Summary Email

on:
  workflow_dispatch:   # manual backup; pg_cron now fires at 19:00 Asia/Jerusalem

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-summary Edge Function
        run: |
          curl --fail-with-body -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/daily-summary" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "x-cron-secret: ${{ secrets.MIA_EMAIL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --show-error
